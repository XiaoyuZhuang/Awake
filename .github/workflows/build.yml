name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEY_ALIAS" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/awake-release.keystore"
            test -s "$RUNNER_TEMP/awake-release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/awake-release.keystore" >> "$GITHUB_ENV"
          else
            echo "Release signing secrets are incomplete; building installable debug APK."
          fi
      - name: Build and check APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug lintDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Awake-debug.apk
          if [[ -n "${KEYSTORE_FILE:-}" ]]; then
            gradle --no-daemon --stacktrace assembleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/Awake-release.apk
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Awake-apk
          path: dist/*.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify launcher and settings on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 scripts/ui_smoke_test.py
      - name: Upload UI verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: ui-smoke/*
          if-no-files-found: ignore
      - name: Publish signed APK to GitHub Releases
        if: env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          version=$(jq -r .versionName version.json)
          gh release create "$tag" dist/Awake-release.apk version.json \
            --target "$GITHUB_SHA" \
            --title "Awake $version (build ${GITHUB_RUN_NUMBER})" \
            --latest \
            --notes "Awake $version：设置页顶部显示实时倒计时，并排加时与停止操作、震动与声音、语言与主题，缩减界面间距，增加后台运行设置入口。本地前台服务与通知不依赖谷歌服务。下载 Awake-release.apk 可覆盖安装之前的签名 Release 版本。"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
