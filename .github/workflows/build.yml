name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEY_ALIAS" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/awake-release.keystore"
            test -s "$RUNNER_TEMP/awake-release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/awake-release.keystore" >> "$GITHUB_ENV"
          else
            echo "Release signing secrets are incomplete; building installable debug APK."
          fi
      - name: Build and check APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug lintDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Awake-debug.apk
          if [[ -n "${KEYSTORE_FILE:-}" ]]; then
            gradle --no-daemon --stacktrace assembleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/Awake-release.apk
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Awake-apk
          path: dist/*.apk
          if-no-files-found: error
      - name: Publish signed APK to GitHub Releases
        if: env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          version=$(jq -r .versionName version.json)
          gh release create "$tag" dist/Awake-release.apk version.json \
            --target "$GITHUB_SHA" \
            --title "Awake $version (build ${GITHUB_RUN_NUMBER})" \
            --latest \
            --notes "Awake $version：修复状态栏重叠，纯黑夜间主题，自定义倒计时和提醒间隔，声音与震动开关，设置入口选择，更新检查及新图标。下载 Awake-release.apk 可覆盖安装之前的签名 Release 版本。"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
